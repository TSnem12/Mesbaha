<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zekr</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: radial-gradient(circle at top, #123F36, #000000 80%);
        }

        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(3px 3px at 20px 30px, white, transparent),
                radial-gradient(3px 3px at 150px 80px, white, transparent),
                radial-gradient(2px 2px at 90px 150px, white, transparent),
                radial-gradient(3px 3px at 250px 200px, white, transparent),
                radial-gradient(2px 2px at 320px 60px, white, transparent),
                radial-gradient(2px 2px at 400px 250px, white, transparent),
                radial-gradient(3px 3px at 60px 300px, white, transparent),
                radial-gradient(2px 2px at 220px 350px, white, transparent),
                radial-gradient(3px 3px at 380px 350px, white, transparent),
                radial-gradient(2px 2px at 130px 250px, white, transparent),
                radial-gradient(3px 3px at 350px 150px, white, transparent),
                radial-gradient(2px 2px at 10px 200px, white, transparent);
            background-repeat: repeat;
            background-size: 450px 450px;
            opacity: 0.6;
            animation: twinkle 6s ease-in-out infinite alternate;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes twinkle {
            0% {
                opacity: 0.3;
            }

            100% {
                opacity: 0.9;
            }
        }

        .circle {
            width: 300px;
            height: 300px;
            background-color: transparent;
            border: 1px solid rgba(212, 175, 55, 0.5);
            color: rgba(212, 175, 55, 0.8);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            font-size: 60px;
            border-radius: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            transition: transform 0.15s ease;
        }

        .circle:active {
            transform: scale(0.92);
        }

        #numberBox {
            border: 1px solid rgba(212, 175, 55, 0.5);
            background-color: transparent;
            color: rgba(212, 175, 55, 0.9);
            border-radius: 8px;
            width: 120px;
            height: 60px;
            font-size: 36px;
            text-align: center;
        }

        .counter {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .icon {
            font-size: 30px;
            cursor: pointer;
            color: rgba(212, 175, 55, 0.8);
        }

        .selectContainer {
            position: absolute;
            top: 20px;
            right: 30px;
        }

        .selectBtn {
            border: 1px solid rgba(212, 175, 55, 0.5);
            background-color: rgba(18, 63, 54, 0.6);
            color: rgba(212, 175, 55, 0.9);
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 18px;
            text-align: center;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.15s ease;
            user-select: none;
        }

        .selectBtn:active {
            transform: scale(0.95);
        }

        #selectedText {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }


        .selectBtn .arrow {
            font-size: 14px;
            transition: transform 0.2s ease;
        }

        .selectContainer.open .arrow {
            transform: rotate(180deg);
        }


        .optionsList {
            position: absolute;
            top: 140%;
            left: 0;
            width: 100%;
            background-color: #0d251f;
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 8px;
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.25s ease;
        }

        .selectContainer.open .optionsList {
            max-height: 300px;
        }

        .optionItem {
            padding: 12px 20px;
            color: rgba(212, 175, 55, 0.85);
            font-size: 17px;
            text-align: center;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }


        .optionItem.selected {
            background-color: rgba(212, 175, 55, 0.25);
            color: #f5e6b8;
        }


        @media (max-width: 480px) {
            .circle {
                width: 220px;
                height: 220px;
                font-size: 45px;
                -webkit-tap-highlight-color: transparent;
            }

            #numberBox {
                width: 90px;
                height: 45px;
                font-size: 28px;
            }

            .selectBtn {
                -webkit-tap-highlight-color: transparent;
                user-select: none;
                transition: transform 0.15s ease;
            }

            .selectBtn:active {
                transform: scale(0.95);
            }

            #selectedText {
                -webkit-tap-highlight-color: transparent;
                user-select: none;
            }

            .optionItem {
                padding: 10px 8px;
                font-size: 15px;
                -webkit-tap-highlight-color: transparent;
            }

            .icon {
                font-size: 32px;
                -webkit-tap-highlight-color: transparent;
            }
        }
    </style>

</head>

<body>

    <div class="stars"></div>

    <div class="selectContainer" id="selectContainer">
        <div class="selectBtn" id="selectBtn">
            <span id="selectedText">-اختر من القائمة-</span>
            <span class="arrow">▾</span>
        </div>
        <div class="optionsList" id="optionsList">
            <div class="optionItem" data-value="سبحان الله">"سبحان الله"</div>
            <div class="optionItem" data-value="الحمد لله">"الحمد لله"</div>
            <div class="optionItem" data-value="أستغفر الله">"أستغفر الله"</div>
            <div class="optionItem" data-value="لا حول ولا قوة إلا بالله">"لا حول ولا قوة إلا بالله"</div>
            <div class="optionItem" data-value="اللهم صلِّ على سيدنا محمد">"اللهم صلِّ على سيدنا محمد"</div>
        </div>
    </div>

    <div class=" counter">
        <input type="text" id="numberBox" readonly placeholder="0">


        <div class="circle" id="circleBtn">
            <p>+</p>
        </div>

        <div class="icon" id="resetBtn">
            <i class="fa-solid fa-rotate-left"></i>
        </div>
    </div>




    <script>
        const numberBox = document.getElementById('numberBox');
        const circle = document.getElementById('circleBtn');

        let counter = parseInt(localStorage.getItem('zekrCounter')) || 0;
        numberBox.value = counter;


        const sound = new Audio('sound.mp3');
        sound.preload = 'auto';

        circle.addEventListener('click', () => {
            counter++;
            numberBox.value = counter;
            localStorage.setItem('zekrCounter', counter);

            if (counter % 100 === 0) {
                circle.style.backgroundColor = '#0d251f';
                sound.currentTime = 0;
                sound.play();
                setTimeout(() => {
                    circle.style.backgroundColor = 'transparent';
                }, 500);
            }
        });

        const icon = document.getElementById('resetBtn');

        icon.addEventListener('click', () => {
            counter = 0;
            numberBox.value = counter;
            localStorage.setItem('zekrCounter', counter);
        });



        const selectContainer = document.getElementById('selectContainer');
        const selectBtn = document.getElementById('selectBtn');
        const selectedText = document.getElementById('selectedText');
        const optionsList = document.getElementById('optionsList');
        const options = document.querySelectorAll('.optionItem');


        selectBtn.addEventListener('click', () => {
            selectContainer.classList.toggle('open');
        });


        options.forEach(option => {
            option.addEventListener('click', () => {
                selectedText.textContent = option.textContent;
                counter = 0;
                numberBox.value = counter;
                localStorage.setItem('zekrCounter', counter);

                options.forEach(option => option.classList.remove('selected'));
                option.classList.add('selected');

                selectContainer.classList.remove('open');
            });
        });

    </script>
</body>

</html>
